<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur vidéo local</title>
<style>
  :root { --bg:#0f1221; --card:#171a2c; --text:#e8eaf6; --muted:#a3acc5; --accent:#7aa2ff; --ok:#9ae6b4; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:900px;margin:24px auto;padding:16px}
  .player{background:var(--card);border:1px solid #232640;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .video-area{position:relative;background:#000}
  video{width:100%;display:block;aspect-ratio:16/9;background:#000}

  .controls{display:flex;flex-direction:column;gap:10px;padding:12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .timebar{display:flex;align-items:center;gap:10px;width:100%}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:60px;text-align:center}
  input[type="range"]{flex:1;appearance:none;height:8px;background:#333a66;border-radius:5px;outline:none}
  input[type="range"]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer}

  button,.file-label{
    background:#212545;color:var(--text);border:1px solid #2a305a;padding:8px 12px;border-radius:8px;cursor:pointer;
    transition:background .2s ease, transform .08s ease;
  }
  button:hover,.file-label:hover{background:#2a305a}
  input[type="file"]{display:none}
  .pill{background:#1c2040;border:1px solid #2a305a;border-radius:999px;padding:6px 10px;color:var(--muted)}
  .value{color:var(--ok);font-variant-numeric:tabular-nums;font-weight:700}
  .hint{font-size:14px;color:var(--muted);margin-top:8px}
  .kbd{background:#1f2444;border:1px solid #2c356a;padding:2px 6px;border-radius:6px;font-weight:700}

  /* --- HUD plein écran --- */
  .fs-hud{
    position:absolute;left:0;right:0;bottom:0;
    padding:10px 14px;
    background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    opacity:1;transition:opacity .25s ease;
    pointer-events:none;
  }
  .fs-hud.hidden{opacity:0}
  .fs-hud-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;pointer-events:auto}
  .hud-btn{background:#212545;color:var(--text);border:1px solid #2a305a;padding:8px 12px;border-radius:8px;cursor:pointer}
  .hud-btn:hover{background:#2a305a}
  .hud-spacer{flex:1}
  .hud-pill{background:#1c2040;border:1px solid #2a305a;border-radius:999px;padding:6px 10px;color:#a3acc5}
  .hud-value{color:#9ae6b4;font-variant-numeric:tabular-nums;font-weight:700}
  :fullscreen #fsHud, :-webkit-full-screen #fsHud{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Lecteur vidéo local</h1>

  <div class="player">
    <div class="video-area" id="videoArea">
      <video id="vid" preload="metadata" playsinline></video>

      <!-- HUD plein écran -->
      <div id="fsHud" class="fs-hud" hidden>
        <div class="fs-hud-inner">
          <button id="fsExitBtn" class="hud-btn" title="Quitter le plein écran">⤺</button>
          <div class="hud-spacer"></div>
          <span class="hud-pill">Restant (réel) : <span id="fsRealRemain" class="hud-value">00:00</span></span>
          <div class="hud-spacer"></div>
          <button id="fsRate08" class="hud-btn" title="0,8×">0,8×</button>
          <button id="fsRate10" class="hud-btn" title="1×">1×</button>
          <button id="fsRate20" class="hud-btn" title="2×">2×</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="row">
        <label class="file-label" title="Ouvrir un fichier vidéo local">
          <input id="file" type="file" accept="video/*"> 📂 Ouvrir une vidéo
        </label>
        <button id="playBtn" title="Lecture/Pause (Espace)">▶️ Lecture</button>
        <button id="rate08" title="Vitesse 0,8×">0,8×</button>
        <button id="rate10" title="Vitesse 1× (C)">1×</button>
        <button id="rate20" title="Vitesse 2× (B)">2×</button>
        <button id="fsBtn" title="Plein écran (F)">⛶ Plein écran</button>
      </div>

      <div class="row timebar">
        <span id="tCur" class="time">00:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="tDur" class="time">00:00</span>
      </div>

      <div class="row">
        <span class="pill">Temps restant (réel) : <span id="realRemain" class="value">00:00</span></span>
      </div>

      <!-- AJOUT : Volume + Vitesse précise -->
      <div class="row">
        <span class="pill">Volume : <span id="volLabel" class="value">100%</span></span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1">
        <span class="pill">Vitesse précise : <span id="rateDisplay" class="value">1,00×</span></span>
        <input id="rateSlider" type="range" min="0.07" max="3" step="0.01" value="1">
      </div>
      <!-- FIN AJOUT -->
    </div>
  </div>

  <p class="hint">
    Raccourcis : <span class="kbd">Espace</span> lecture/pause ·
    <span class="kbd">B</span> 2× ·
    <span class="kbd">N</span> 0,8× ·
    <span class="kbd">C</span> 1× ·
    <span class="kbd">F</span> plein écran ·
    <span class="kbd">←/→</span> ±5s
  </p>
</div>

<script>
  // Références
  const vid = document.getElementById('vid');
  const file = document.getElementById('file');
  const playBtn = document.getElementById('playBtn');
  const rate08 = document.getElementById('rate08');
  const rate10 = document.getElementById('rate10');
  const rate20 = document.getElementById('rate20');
  const fsBtn = document.getElementById('fsBtn');
  const seek = document.getElementById('seek');
  const tCur = document.getElementById('tCur');
  const tDur = document.getElementById('tDur');
  const videoArea = document.getElementById('videoArea');
  const realRemainEl = document.getElementById('realRemain');

  // AJOUT : Volume + Vitesse précise
  const vol = document.getElementById('vol');
  const volLabel = document.getElementById('volLabel');
  const rateSlider = document.getElementById('rateSlider');
  const rateDisplay = document.getElementById('rateDisplay');

  // HUD FS
  const fsHud = document.getElementById('fsHud');
  const fsRealRemain = document.getElementById('fsRealRemain');
  const fsExitBtn = document.getElementById('fsExitBtn');
  const fsRate08 = document.getElementById('fsRate08');
  const fsRate10 = document.getElementById('fsRate10');
  const fsRate20 = document.getElementById('fsRate20');
  let fsHideTimer = null;

  // Utils
  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    const mm = m.toString().padStart(2,'0'), ss = sec.toString().padStart(2,'0');
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }
  function isFullscreen(){
    return !!document.fullscreenElement || !!document.webkitFullscreenElement;
  }
  function showFsHud(){
    if (!fsHud) return;
    fsHud.hidden = false;
    fsHud.classList.remove('hidden');
    clearTimeout(fsHideTimer);
    fsHideTimer = setTimeout(()=>hideFsHud(), 3000);
  }
  function hideFsHud(){
    if (!fsHud) return;
    fsHud.classList.add('hidden');
  }

  // Temps restant réel (page + HUD)
  function updateRealRemain(){
    const r = vid.playbackRate || 1;
    const cur = vid.currentTime || 0;
    const dur = isFinite(vid.duration) ? vid.duration : 0;
    const remainReal = (dur - cur) / r;
    if (realRemainEl) realRemainEl.textContent = fmt(remainReal);
    if (fsRealRemain) fsRealRemain.textContent = fmt(remainReal);
  }

  // Charger un fichier local (reset propre + même fichier possible)
  file.addEventListener('change', () => {
    const f = file.files?.[0];
    if (!f) return;
    const url = URL.createObjectURL(f);

    vid.pause();
    vid.removeAttribute('src');
    vid.load();

    vid.src = url;
    vid.playbackRate = 1.0;
    vid.load();
    vid.play().catch(()=>{ /* l'utilisateur cliquera ▶️ si besoin */ });

    file.value = '';
    updateRealRemain();
    updateRateDisplay();
  });

  // Lecture/Pause
  playBtn.addEventListener('click', () => { if (vid.paused) vid.play(); else vid.pause(); });
  vid.addEventListener('play', ()=> playBtn.textContent = '⏸️ Pause');
  vid.addEventListener('pause',()=> playBtn.textContent = '▶️ Lecture');

  // Vitesse (boutons)
  function setRate(r){
    const val = Math.max(0.07, Math.min(16, r));
    vid.playbackRate = val;
    if (rateSlider) rateSlider.value = String(val); // sync slider
    updateRateDisplay();
    updateRealRemain();
  }
  rate08.addEventListener('click', ()=> setRate(0.8));
  rate10.addEventListener('click', ()=> setRate(1.0));
  rate20.addEventListener('click', ()=> setRate(2.0));

  // Plein écran (bouton + double-clic)
  function toggleFullscreen(){
    if (!document.fullscreenElement && videoArea.requestFullscreen) videoArea.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  }
  fsBtn.addEventListener('click', toggleFullscreen);
  vid.addEventListener('dblclick', toggleFullscreen);

  // Slider + temps
  seek.addEventListener('input', ()=>{
    if (vid.duration) { vid.currentTime = (seek.value / 1000) * vid.duration; updateRealRemain(); }
  });
  vid.addEventListener('timeupdate', ()=>{
    if (!vid.duration) return;
    seek.value = Math.round((vid.currentTime / vid.duration) * 1000);
    tCur.textContent = fmt(vid.currentTime);
    tDur.textContent = fmt(vid.duration);
    updateRealRemain();
  });
  vid.addEventListener('loadedmetadata', ()=>{ tDur.textContent = fmt(vid.duration || 0); updateRealRemain(); });

  // Raccourcis clavier
  window.addEventListener('keydown', (e) => {
    const tag = (e.target?.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || e.target?.isContentEditable;

    if (!typing && e.code === 'Space') { e.preventDefault(); if (vid.paused) vid.play(); else vid.pause(); if (isFullscreen()) showFsHud(); }
    if (!typing && (e.key === 'b' || e.key === 'B')) { setRate(2.0); if (isFullscreen()) showFsHud(); }
    if (!typing && (e.key === 'n' || e.key === 'N')) { setRate(0.8); if (isFullscreen()) showFsHud(); }
    if (!typing && (e.key === 'c' || e.key === 'C')) { setRate(1.0); if (isFullscreen()) showFsHud(); }
    if (!typing && (e.key === 'f' || e.key === 'F'))  { toggleFullscreen(); }
    if (!typing && e.key === 'ArrowRight'){ vid.currentTime = Math.min((vid.duration||0), vid.currentTime + 5); updateRealRemain(); if (isFullscreen()) showFsHud(); }
    if (!typing && e.key === 'ArrowLeft'){  vid.currentTime = Math.max(0, vid.currentTime - 5); updateRealRemain(); if (isFullscreen()) showFsHud(); }
  });

  // HUD FS : boutons
  fsExitBtn.addEventListener('click', () => {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  });
  fsRate08.addEventListener('click', () => { setRate(0.8); showFsHud(); });
  fsRate10.addEventListener('click', () => { setRate(1.0); showFsHud(); });
  fsRate20.addEventListener('click', () => { setRate(2.0); showFsHud(); });

  // Afficher/Masquer HUD selon FS + mouvement souris
  document.addEventListener('fullscreenchange', () => {
    if (isFullscreen()){ fsHud.hidden = false; showFsHud(); }
    else { clearTimeout(fsHideTimer); fsHud.hidden = true; fsHud.classList.remove('hidden'); }
  });
  document.addEventListener('webkitfullscreenchange', () => { // Safari
    if (isFullscreen()){ fsHud.hidden = false; showFsHud(); }
    else { clearTimeout(fsHideTimer); fsHud.hidden = true; fsHud.classList.remove('hidden'); }
  });
  videoArea.addEventListener('mousemove', () => { if (isFullscreen()) showFsHud(); });

  /* ===== AJOUT : logique Volume + Vitesse précise (sliders) ===== */
  // Volume
  function updateVolLabel(){ volLabel.textContent = `${Math.round((vid.volume||0)*100)}%`; }
  if (vol){
    vid.volume = Number(vol.value);
    updateVolLabel();
    vol.addEventListener('input', () => {
      vid.volume = Number(vol.value);
      updateVolLabel();
    });
  }

  // Vitesse précise
  function updateRateDisplay(){
    const r = vid.playbackRate || 1;
    rateDisplay.textContent = r.toLocaleString('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:2}) + '×';
  }
  if (rateSlider){
    rateSlider.value = "1";
    updateRateDisplay();
    rateSlider.addEventListener('input', () => {
      setRate(parseFloat(rateSlider.value));
    });
  }

  // Si la vitesse change autrement (boutons / clavier / navigateur)
  vid.addEventListener('ratechange', () => {
    if (rateSlider) rateSlider.value = String(vid.playbackRate);
    updateRateDisplay();
    updateRealRemain();
  });
  /* ===== FIN AJOUT ===== */
</script>
</body>
</html>
